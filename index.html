<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply saved appearance before React mounts to prevent a light-theme flash.
      try {
        if (localStorage.getItem('tawseel-theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (_) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wasel Admin — Delivery Community Membership & Subscription Hub</title>
    <meta name="description" content="Administrative platform for WhatsApp delivery communities to manage member registration, monthly subscriptions, payment proof verification, and group reporting." />
    <meta property="og:title" content="Wasel Admin — Delivery Community Membership & Subscription Hub" />
    <meta property="og:description" content="Administrative platform for WhatsApp delivery communities to manage member registration, monthly subscriptions, payment proof verification, and group reporting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>

</html>
